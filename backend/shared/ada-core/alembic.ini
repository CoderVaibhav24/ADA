# Alembic configuration for ada-core — the schema ada-api and ada-ml share.
#
# sqlalchemy.url is deliberately absent. The URL comes from DATABASE_URL through
# ada_core/alembic/env.py, so there is one place it is configured: a URL
# committed here is a credential committed here, and a URL that disagrees with
# the application's is a migration applied to the wrong database with no error.
#
# script_location points INSIDE the package. The migrations have to travel with
# the installed wheel, because ada-ml applies them at boot inside a container
# that has no copy of this repository.

[alembic]
script_location = ada_core/alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

# Revision files are named so that `ls` orders them the way they apply.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
