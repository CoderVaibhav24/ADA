services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ada_pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/99-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: ada-supertokens
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/supertokens"
      API_KEYS: ${SUPERTOKENS_API_KEY}
    ports:
      - "${SUPERTOKENS_PORT:-3567}:3567"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e 'GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q Hello"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    image: ada-backend:poc
    container_name: ada-backend
    restart: unless-stopped
    # PID 1 is uvicorn, which does not reap children. The ML pipeline forks
    # worker threads/processes (GDAL, onnxruntime, torch), and when one exits
    # during a long analysis it becomes a zombie that PID 1 never collects.
    # Docker then cannot stop the container at all:
    #   "PID ... is zombie and can not be killed. Use the --init option"
    # tini as PID 1 forwards signals and reaps orphans, so restarts work.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    environment:
      # In-network addresses — these deliberately override the host-facing
      # values in .env, which stay valid for running the app outside Docker.
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      SUPERTOKENS_CONNECTION_URI: "http://supertokens:3567"
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY}
      # The browser reaches the API through the frontend's nginx, so API and
      # website are one origin and session cookies stay first-party.
      API_DOMAIN: ${APP_ORIGIN:-http://localhost:5173}
      WEBSITE_DOMAIN: ${APP_ORIGIN:-http://localhost:5173}
      DATA_DIR: /app/data
      # First-boot convenience (see backend/docker-entrypoint.sh)
      AUTO_FETCH_WEIGHTS: ${AUTO_FETCH_WEIGHTS:-true}
      AUTO_SAMPLE_DATA: ${AUTO_SAMPLE_DATA:-true}
      # ML tunables — same names as .env, defaults match app/config.py
      MODEL_MODE: ${MODEL_MODE:-segdiff}
      MODEL_BACKEND: ${MODEL_BACKEND:-auto}
      SEED_MODE: ${SEED_MODE:-encroachment}
      SAM_REFINE: ${SAM_REFINE:-true}
      CHIP_SIZE: ${CHIP_SIZE:-256}
      CHIP_OVERLAP: ${CHIP_OVERLAP:-64}
      CHANGE_THRESHOLD: ${CHANGE_THRESHOLD:-0.5}
      MIN_CHANGE_AREA_M2: ${MIN_CHANGE_AREA_M2:-15.0}
      # Compute placement. REQUIRE_GPU=true turns a silent CPU fallback into a
      # startup error — worth enabling here, because in a container a fallback
      # is invisible and the symptom is just "analyses take forever".
      ML_DEVICE: ${ML_DEVICE:-cuda}
      REQUIRE_GPU: ${REQUIRE_GPU:-false}
      ONNX_CPU_THREADS: ${ONNX_CPU_THREADS:-4}
      # Building segmenter: changestar (ViT-B, 1024 px) | geobase (U-Net, 256 px)
      BUILDING_BACKEND: ${BUILDING_BACKEND:-changestar}
      # Vegetation: learned (SegFormer-B5 / LoveDA) | index (NDVI + excess-green)
      VEGETATION_MODE: ${VEGETATION_MODE:-learned}
      # Warp from the COG (has overviews) rather than the originals.
      SUPERIMPOSE_SOURCE: ${SUPERIMPOSE_SOURCE:-auto}
      # Refinement: sam2 | sam3 (sam3 needs access to the GATED facebook/sam3)
      SAM_BACKEND: ${SAM_BACKEND:-sam2}
      SAM_MODEL_REPO: ${SAM_MODEL_REPO:-facebook/sam2.1-hiera-large}
      SAM_MODEL_LOCAL: ${SAM_MODEL_LOCAL:-sam2.1-hiera-large}
      # Instance decision: rules | shadow | active
      INSTANCE_DECIDER: ${INSTANCE_DECIDER:-shadow}
      MIN_TRAINING_SAMPLES: ${MIN_TRAINING_SAMPLES:-150}
      DETECT_DEMOLITION: ${DETECT_DEMOLITION:-true}
      # Needed only to pull the gated SAM 3 weights; harmless when unset.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Uploads, COGs, masks, vendored weights and the demo pair all live here
      # and survive `docker compose down`.
      - ./data:/app/data
      # Share the host's HuggingFace cache so a rebuild does not re-download
      # ~1.5 GB of weights that are already on disk.
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # GPU passthrough via the nvidia container runtime.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    image: ada-frontend:poc
    container_name: ada-frontend
    restart: unless-stopped
    depends_on:
      # service_started, not service_healthy: nginx only needs the `backend`
      # DNS name to resolve at config load, and the backend's first boot can
      # spend minutes downloading model weights.
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  ada_pgdata:
