[project]
name = "ada-core"
version = "0.1.0"
description = "ADA shared domain: the ORM models, the engine and the additive migrations."
requires-python = ">=3.12"

# Deliberately thin. Adding FastAPI here would let a request-shaped concern
# reach the ML worker, and adding rasterio or torch would put a gigabyte of
# wheels into the API image for the sake of three table definitions.
dependencies = [
  "sqlalchemy>=2.0",
  # Alembic owns the schema — ada_core/alembic. It is a hard dependency rather
  # than an extra because run_migrations() imports it on every ada-ml boot.
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ada_core*"]

# The migration chain is executed at boot, so it is part of the package rather
# than a directory next to it: ada-ml applies migrations inside a container that
# has no copy of this repository. Without these globs the scripts are missing
# from the wheel, and the failure is "Path doesn't exist: .../alembic" at
# startup rather than at build time.
#
# versions/*.py is listed as data rather than discovered as a package on
# purpose — an __init__.py in a versions directory is a file Alembic then tries
# to read as a revision.
[tool.setuptools.package-data]
ada_core = [
  "alembic/*.py",
  "alembic/*.mako",
  "alembic/versions/*.py",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:ada_core.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these. Rewrapping a generated migration by hand makes the next
# `revision --autogenerate` produce a diff against our own formatting rather
# than against the schema, which is noise in the one file that has to be read
# literally.
"ada_core/alembic/versions/*" = ["E501"]
