# Alembic configuration for ada-notify.
#
# sqlalchemy.url is deliberately absent: the URL comes from ADA_DATABASE_URL
# via alembic/env.py. A URL committed here is a credential committed here, and a
# URL that disagrees with the application's is a migration applied to the wrong
# database with no error.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

# Revision files are named so that `ls` orders them the way they apply.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
