[project]
name = "ada-notify"
version = "0.1.0"
description = "ADA notification service — ingestion, fan-out and delivery."
requires-python = ">=3.12"

dependencies = [
  # Floors raised past known CVEs (starlette multipart DoS, CVE-2024-47874).
  "fastapi>=0.115.3",
  "starlette>=0.40.0",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  # http2 pulls in h2: APNs accepts HTTP/2 only.
  "httpx[http2]>=0.28",
  "structlog>=24.4",
  # The broker's only adapter. Imported by app/broker/redis_streams.py and by
  # nothing else — tests/test_import_graph.py fails the build if that changes.
  "redis>=5.2",
  # SMTP without blocking the event loop. smtplib in the standard library is
  # synchronous, and one slow relay would otherwise stall every other coroutine
  # in the worker process, including the reclaimer.
  "aiosmtplib>=3.0",
]

[tool.uv]
# An application, not a library: uv installs its dependencies but never the
# service itself. Every service's top-level package is called `app`, so four
# editable installs would shadow each other in the shared workspace venv; `app`
# is imported from the service directory (cwd / PYTHONPATH) instead.
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# `app` is not installed (package = false), so the service root goes on sys.path.
pythonpath = ["."]
asyncio_mode = "auto"
# Both scopes, and they have to agree.
#
# With only the fixture scope set to "session", every test still runs on its own
# function-scoped loop, and the session-scoped fixtures — the httpx client, the
# database connection — end up created on whichever loop happened to be first and
# finalised after it has closed. The symptom is "RuntimeError: Event loop is
# closed" raised during teardown of a test that passed, which reads as a broken
# test rather than as configuration.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test credentials are the point

# UP042 wants enum.StrEnum instead of (str, enum.Enum). Not here: these enums are
# mapped to native PostgreSQL types through _pg_enum's values_callable, and they
# are compared against plain strings from JSON payloads in several places. The
# suggested change is a schema-adjacent edit with no benefit, on the one module
# where a subtle difference in enum behaviour would be expensive.
"app/models.py" = ["UP042"]
