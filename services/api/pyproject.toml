[project]
name = "ada-api"
version = "0.1.0"
description = "ADA API service — projects, imagery, red zones, analyses and map tiles."
requires-python = ">=3.12"

# No torch, no onnxruntime, no transformers, no opencv: this process answers
# browsers, and the heaviest thing it does is read a tile out of a COG. Keeping
# the model stack out takes gigabytes off the image and the GPU out of the
# blast radius of an HTTP request. Resolved versions are pinned in /uv.lock.
dependencies = [
  "ada-core",
  "ada-platform-sdk",
  # Floors raised past known CVEs: fastapi/starlette (multipart DoS,
  # CVE-2024-47874) and python-multipart (CVE-2024-53981).
  "fastapi>=0.115.3",
  "starlette>=0.40.0",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",    # multipart uploads on the raster route
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.27",                 # the ada-ml client, and the JWKS fetch
  # Keycloak tokens are verified locally against the realm's JWKS.
  "pyjwt[crypto]>=2.10",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  # Raster read paths (map tiles, per-polygon preview). rio-tiler, not titiler.
  "rasterio>=1.4",
  "rio-tiler>=7.0",
  "shapely>=2.0",
  "pyproj>=3.7",
  "numpy>=1.26",
  "pillow>=10.4",
  "lxml>=5.3",                   # KML boundary import (app/icms/boundary_import.py)
  "boto3>=1.34",                 # cold-tier archive store (app/coldstore.py), any S3 endpoint
  "pillow-heif>=1.0",            # an iPhone HEIC photo is converted to JPEG on upload (app/icms/evidence_store.py)
]

[tool.uv.sources]
ada-core = { workspace = true }
ada-platform-sdk = { workspace = true }

[tool.uv]
# An application, not a library: uv installs its dependencies but never the
# service itself. Every service's top-level package is called `app`, so four
# editable installs would shadow each other in the shared workspace venv; `app`
# is imported from the service directory (cwd / PYTHONPATH) instead.
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# `app` is not installed (package = false), so the service root goes on sys.path.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
# B008 flags a function call in an argument default. In FastAPI that IS the
# dependency-injection syntax — `db: Session = Depends(get_db)` and
# `file: UploadFile = File(...)` — and the framework evaluates it per request
# rather than once at import, which is the thing B008 exists to catch. The
# alternative spelling, Annotated[Session, Depends(get_db)], is equivalent and
# rewriting twenty-seven working endpoint signatures to satisfy a linter is
# risk without benefit.
"app/deps.py" = ["B008"]
"app/security.py" = ["B008"]
"app/routers/*.py" = ["B008"]
"app/icms/*.py" = ["B008"]
"app/api/v1/*.py" = ["B008"]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake credentials are the point
