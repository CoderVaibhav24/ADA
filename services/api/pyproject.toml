[project]
name = "ada-api"
version = "0.1.0"
description = "ADA API service — projects, imagery, red zones, analyses and map tiles."
requires-python = ">=3.12"

# The runtime dependencies live in requirements.txt, not here, because the
# image installs them with pip -r and two lists would drift. This file exists
# for the tooling: pytest and ruff configuration, and the package discovery
# that makes `app` importable from the service root.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
# B008 flags a function call in an argument default. In FastAPI that IS the
# dependency-injection syntax — `db: Session = Depends(get_db)` and
# `file: UploadFile = File(...)` — and the framework evaluates it per request
# rather than once at import, which is the thing B008 exists to catch. The
# alternative spelling, Annotated[Session, Depends(get_db)], is equivalent and
# rewriting twenty-seven working endpoint signatures to satisfy a linter is
# risk without benefit.
"app/deps.py" = ["B008"]
"app/security.py" = ["B008"]
"app/routers/*.py" = ["B008"]
"app/icms/*.py" = ["B008"]
"app/api/v1/*.py" = ["B008"]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake credentials are the point
