[project]
name = "ada-auth"
version = "0.1.0"
description = "ADA authentication service — phone + OTP as a first factor."
requires-python = ">=3.12"

# No database and no ORM, deliberately. Every durable fact about a person lives
# in Keycloak, and the only state this service holds is a pending OTP, which is
# worthless five minutes after it was minted. Giving it a PostgreSQL schema would
# create a second, weaker place where identity is recorded.
dependencies = [
  # Floors raised past known CVEs (starlette multipart DoS, CVE-2024-47874).
  "fastapi>=0.115.3",
  "starlette>=0.40.0",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "structlog>=24.4",
  # The only adapter for OTP storage and throttling. Imported by
  # app/redis_store.py and by nothing else — tests/test_import_graph.py fails
  # the build if that changes.
  "redis>=5.2",
  # SMTP for the email one-time code, without blocking the event loop.
  # smtplib in the standard library is synchronous, and one slow relay would
  # stall every other request in the process — including the code somebody
  # else is waiting on.
  "aiosmtplib>=3.0",
  # EmailStr. A malformed address becomes a 422 at the door instead of an SMTP
  # rejection three calls later.
  "email-validator>=2.0",
]

[tool.uv]
# An application, not a library: uv installs its dependencies but never the
# service itself. Every service's top-level package is called `app`, so four
# editable installs would shadow each other in the shared workspace venv; `app`
# is imported from the service directory (cwd / PYTHONPATH) instead.
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# `app` is not installed (package = false), so the service root goes on sys.path.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test credentials are the point
