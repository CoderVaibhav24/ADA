# Kong declarative config (DB-less). Loaded by the `kong` service in
# infra/compose/docker-compose.yml; see README.md in this directory.
#
# Upstream URLs below are the native-dev defaults. docker-start.sh rewrites them
# from KONG_UPSTREAM_API / KONG_UPSTREAM_AUTH / KONG_UPSTREAM_IDP at container
# start, so do not change their spelling without changing that script too.
#
# The consumers.jwt_secrets block is generated by sync-jwks.sh. Until it has run
# once, every /api request except the public routes answers 401.
_format_version: "3.0"
_transform: true

services:
  - name: ada-api
    url: http://host.docker.internal:8000
    routes:
      - name: api
        paths: [/api]
        strip_path: false
        preserve_host: true
      # Both regex routes carry a method as well as a path, so they outrank the
      # /api prefix route for POST and fall through to it for everything else.
      - name: api-raster-upload
        methods: [POST]
        paths: ["~/api/projects/[^/]+/rasters$"]
        strip_path: false
        preserve_host: true
        # Stream multi-GB GeoTIFFs to ada-api instead of spooling them in Kong.
        request_buffering: false
        plugins:
          - name: request-size-limiting
            config:
              allowed_payload_size: 2048
              size_unit: megabytes
              require_content_length: true
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
      - name: api-analysis-submit
        methods: [POST]
        paths: ["~/api/projects/[^/]+/analyses$"]
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              limit_by: ip
    plugins:
      # Floor only: signature + exp. ada-api still checks iss, azp, roles and zones.
      - name: jwt
        config:
          key_claim_name: kid
          claims_to_verify: [exp]
          header_names: [authorization]
          uri_param_names: []
          cookie_names: []
          run_on_preflight: false
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
              - "X-Content-Type-Options:nosniff"
              - "X-Frame-Options:DENY"
              - "Referrer-Policy:no-referrer"

  # Same upstream, no jwt: a service-level plugin cannot be switched off per route.
  - name: ada-api-public
    url: http://host.docker.internal:8000
    routes:
      - name: api-public
        methods: [GET, HEAD]
        # auth/config bootstraps the SPA before it has a token; health/ready is the probe.
        paths: ["~/api/health$", "~/api/health/ready$", "~/api/auth/config$",
                "~/api/openapi\\.json$", /api/docs]
        strip_path: false
        preserve_host: true
    plugins:
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
              - "X-Content-Type-Options:nosniff"
              - "X-Frame-Options:DENY"
              - "Referrer-Policy:no-referrer"

  - name: ada-auth
    url: http://host.docker.internal:8002
    routes:
      - name: auth-api
        paths: [/auth-api]
        strip_path: true
        preserve_host: true
      # A signed-in client refreshes every few minutes, so refresh gets its own
      # 60/min bucket instead of sharing the 10/min OTP one. A route-level
      # rate-limiting replaces the service-level one for this route. A regex
      # route cannot strip just /auth-api, so the upstream path is set here.
      - name: auth-api-refresh
        methods: [POST]
        paths: ["~/auth-api/v1/auth/refresh$"]
        strip_path: false
        preserve_host: true
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /v1/auth/refresh
          - name: rate-limiting
            config:
              minute: 60
              policy: local
              limit_by: ip
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          policy: local
          limit_by: ip
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
              - "X-Content-Type-Options:nosniff"
              - "X-Frame-Options:DENY"
              - "Referrer-Policy:no-referrer"

  # Keycloak serves under its relative path /idp, so nothing is stripped.
  - name: keycloak
    url: http://keycloak:8090
    routes:
      - name: idp
        paths: [/idp/realms, /idp/resources]
        strip_path: false
        preserve_host: true
      # Longer prefixes than /idp/realms, so they win. The admin console and the
      # master realm stay reachable only on 127.0.0.1:8090, never through here.
      - name: idp-blocked
        paths: [/idp/admin, /idp/realms/master]
        strip_path: false
        plugins:
          - name: request-termination
            config:
              status_code: 404
              message: Not Found
    plugins:
      # No X-Frame-Options here: Keycloak's login-status and silent-SSO iframes
      # must stay frameable, and Keycloak sets its own framing policy.
      - name: response-transformer
        config:
          add:
            headers:
              - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
              - "X-Content-Type-Options:nosniff"
              - "Referrer-Policy:no-referrer"

consumers:
  - username: keycloak
    # BEGIN jwt_secrets (generated by sync-jwks.sh; do not edit by hand)
    jwt_secrets: []
    # END jwt_secrets

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  - name: request-size-limiting
    config:
      allowed_payload_size: 20
      size_unit: megabytes
