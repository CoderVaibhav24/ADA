# Fixed project name: volume and network names no longer depend on the
# directory this file lives in (they were infra_* before the relayout).
name: ada

# Dev model: `docker compose up -d` starts infrastructure only (postgres, redis,
# keycloak, mailpit, kong) and the services run natively (`make api` etc.).
# `docker compose --profile full up -d` starts the whole stack in containers.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ada-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_KEYCLOAK_DB: ${POSTGRES_KEYCLOAK_DB:-keycloak}
      POSTGRES_NOTIFY_DB: ${POSTGRES_NOTIFY_DB:-ada_notify}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-${POSTGRES_USER}}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - ada_pgdata:/var/lib/postgresql/data
      - ../postgres/init/init-db.sh:/docker-entrypoint-initdb.d/99-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ada]

  redis:
    image: redis:7.4.11-alpine
    container_name: ada-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ada_redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - '[ -z "$${REDIS_PASSWORD}" ] || export REDISCLI_AUTH="$${REDIS_PASSWORD}"; redis-cli ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ada]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: ada-keycloak
    restart: unless-stopped
    logging: *default-logging
    command: ["start-dev", "--import-realm", "--features=token-exchange:v1"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-${POSTGRES_USER}}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: "${KC_HTTP_PORT:-8090}"
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:5173/idp}
      # Admin console on the published port. Without it KC_HOSTNAME sends the console to
      # 5173 too, so the console is unreachable whenever the frontend is not running.
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://localhost:${KC_HTTP_HOST_PORT:-8090}/idp}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/idp}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "${KC_HOSTNAME_STRICT:-false}"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      ADA_NOTIFY_CLIENT_SECRET: ${ADA_NOTIFY_CLIENT_SECRET:?set ADA_NOTIFY_CLIENT_SECRET in .env}
      ADA_AUTH_CLIENT_SECRET: ${ADA_AUTH_CLIENT_SECRET:?set ADA_AUTH_CLIENT_SECRET in .env}
      ADA_ML_CLIENT_SECRET: ${ADA_ML_CLIENT_SECRET:?set ADA_ML_CLIENT_SECRET in .env}
      ADA_GOOGLE_CLIENT_ID: ${ADA_GOOGLE_CLIENT_ID:-}
      ADA_GOOGLE_CLIENT_SECRET: ${ADA_GOOGLE_CLIENT_SECRET:-}
      ADA_GOOGLE_HOSTED_DOMAIN: ${ADA_GOOGLE_HOSTED_DOMAIN:-pcsmcpl.net}
      ADA_GITHUB_CLIENT_ID: ${ADA_GITHUB_CLIENT_ID:-}
      ADA_GITHUB_CLIENT_SECRET: ${ADA_GITHUB_CLIENT_SECRET:-}
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: "${KC_SMTP_PORT:-1025}"
      KC_SMTP_FROM: ${KC_SMTP_FROM:-ada@pcsmcpl.net}
      KC_SMTP_FROM_DISPLAY_NAME: ${KC_SMTP_FROM_DISPLAY_NAME:-ADA}
      KC_SMTP_USERNAME: ${KC_SMTP_USERNAME:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      KC_SMTP_STARTTLS: "${KC_SMTP_STARTTLS:-false}"
      KC_SMTP_SSL: "${KC_SMTP_SSL:-false}"
    ports:
      - "127.0.0.1:${KC_HTTP_HOST_PORT:-8090}:${KC_HTTP_PORT:-8090}"
      - "127.0.0.1:${KC_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ../keycloak/realm-ada.json:/opt/keycloak/data/import/realm-ada.json:ro
      - ../../apps/keycloak-theme/dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar:/opt/keycloak/providers/ada-login-theme.jar:ro
    mem_limit: 2g
    healthcheck:

      test: ["CMD-SHELL", "[ -f /tmp/HealthCheck.java ] || echo \"public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }\" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000${KC_HTTP_RELATIVE_PATH:-/idp}/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    networks: [ada]

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ada-mailpit
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - ada_mailpitdata:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    networks: [ada]

  # API gateway, DB-less: routes and plugins in ../gateway/kong.yml (see its README).
  # Upstreams default to the native services on the host; with --profile full set
  # KONG_UPSTREAM_API=http://ada-api:8000 and KONG_UPSTREAM_AUTH=http://ada-auth:8002.
  kong:
    image: kong:3.9.1
    container_name: ada-kong
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/bin/sh", "/kong/docker-start.sh"]
    environment:
      KONG_DATABASE: "off"
      # Rendered from /kong/kong.yml by docker-start.sh with the upstreams below.
      KONG_DECLARATIVE_CONFIG: /tmp/kong/kong.yml
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_HEADERS: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_UPSTREAM_API: ${KONG_UPSTREAM_API:-http://host.docker.internal:8000}
      KONG_UPSTREAM_AUTH: ${KONG_UPSTREAM_AUTH:-http://host.docker.internal:8002}
      KONG_UPSTREAM_IDP: ${KONG_UPSTREAM_IDP:-http://keycloak:${KC_HTTP_PORT:-8090}}
      # Behind a load balancer the per-IP rate limits see only its address: set
      # the LB's CIDRs here and KONG_REAL_IP_HEADER=X-Forwarded-For (README.md).
      KONG_TRUSTED_IPS: ${KONG_TRUSTED_IPS:-}
      KONG_REAL_IP_HEADER: ${KONG_REAL_IP_HEADER:-X-Real-IP}
      KONG_REAL_IP_RECURSIVE: ${KONG_REAL_IP_RECURSIVE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../gateway:/kong:ro
    ports:
      - "127.0.0.1:${KONG_PROXY_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [ada]

  # Cold-tier object store for dev (docs/ADA-Upload-and-ML-Runtime-Design.md §5).
  # `docker compose --profile cold up -d` starts it; ada-api's COLD_STORE_ENDPOINT
  # must then point at it (see .env.example). Off by default: no profile, no cost.
  minio:
    image: minio/minio:latest
    container_name: ada-minio
    restart: unless-stopped
    logging: *default-logging
    profiles: ["cold"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${COLD_STORE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${COLD_STORE_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [ada]

  # One-shot: creates the cold bucket with Object Lock + versioning. Re-running
  # against an existing bucket is a no-op (mb failure is swallowed).
  minio-init:
    image: minio/mc
    container_name: ada-minio-init
    restart: "no"
    logging: *default-logging
    profiles: ["cold"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      COLD_STORE_ENDPOINT: ${COLD_STORE_ENDPOINT:-http://minio:9000}
      COLD_STORE_BUCKET: ${COLD_STORE_BUCKET:-ada-cold}
      COLD_STORE_ACCESS_KEY: ${COLD_STORE_ACCESS_KEY:-minioadmin}
      COLD_STORE_SECRET_KEY: ${COLD_STORE_SECRET_KEY:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set cold "$$COLD_STORE_ENDPOINT" "$$COLD_STORE_ACCESS_KEY" "$$COLD_STORE_SECRET_KEY" &&
        (mc mb --with-lock "cold/$$COLD_STORE_BUCKET" || echo "bucket exists, skipping") &&
        mc version enable "cold/$$COLD_STORE_BUCKET" &&
        exit 0
    # MinIO purges incomplete multipart uploads after 24 h on its own; on AWS S3 add an AbortIncompleteMultipartUpload lifecycle rule (1 day) to the bucket.
    networks: [ada]

  ada-auth:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/auth-otp/Dockerfile
    image: ada/auth:0.1.0
    container_name: ada-auth
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ADA_ISSUER: ${ADA_ISSUER:?set ADA_ISSUER in .env}
      ADA_INTERNAL_ISSUER_URL: ${ADA_INTERNAL_ISSUER_URL:-http://keycloak:${KC_HTTP_PORT:-8090}${KC_HTTP_RELATIVE_PATH:-/idp}/realms/${ADA_REALM:-pcsmcpl}}
      ADA_REDIS_URL: ${ADA_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      ADA_ENV: ${ADA_ENV:-local}
      ADA_LOG_LEVEL: ${ADA_LOG_LEVEL:-INFO}
      ADA_AUTH_CLIENT_ID: ${ADA_AUTH_CLIENT_ID:-ada-auth}
      ADA_AUTH_CLIENT_SECRET: ${ADA_AUTH_CLIENT_SECRET:?set ADA_AUTH_CLIENT_SECRET in .env}
      ADA_OTP_HMAC_KEY: ${ADA_OTP_HMAC_KEY:?set ADA_OTP_HMAC_KEY in .env}
      ADA_SMS_PROVIDER: ${ADA_SMS_PROVIDER:-console}
      ADA_TWOFACTOR_API_KEY: ${ADA_TWOFACTOR_API_KEY:-}
      ADA_TWOFACTOR_TEMPLATE: ${ADA_TWOFACTOR_TEMPLATE:-OTP1}
      ADA_EMAIL_OTP_PROVIDER: ${ADA_EMAIL_OTP_PROVIDER:-console}
      ADA_AUTH_SMTP_HOST: ${ADA_AUTH_SMTP_HOST:-mailpit}
      ADA_AUTH_SMTP_PORT: "${ADA_AUTH_SMTP_PORT:-1025}"
      ADA_AUTH_SMTP_USERNAME: ${ADA_AUTH_SMTP_USERNAME:-}
      ADA_AUTH_SMTP_PASSWORD: ${ADA_AUTH_SMTP_PASSWORD:-}
      ADA_AUTH_SMTP_STARTTLS: "${ADA_AUTH_SMTP_STARTTLS:-false}"
      ADA_AUTH_SMTP_SSL: "${ADA_AUTH_SMTP_SSL:-false}"
      ADA_AUTH_EMAIL_FROM: ${ADA_AUTH_EMAIL_FROM:-ada@pcsmcpl.net}
      ADA_AUTH_EMAIL_FROM_NAME: ${ADA_AUTH_EMAIL_FROM_NAME:-ADA}
      ADA_OTP_REVEAL_UNKNOWN_EMAIL: ${ADA_OTP_REVEAL_UNKNOWN_EMAIL:-false}

      ADA_OTP_PHONE_ATTRIBUTE: ${ADA_OTP_PHONE_ATTRIBUTE:-phoneNumber}
      ADA_OTP_REVEAL_UNKNOWN_PHONE: ${ADA_OTP_REVEAL_UNKNOWN_PHONE:-false}
      ADA_DEV_OTP: ${ADA_DEV_OTP:-}
      ADA_ALLOW_OTP_DEV_BYPASS: ${ADA_ALLOW_OTP_DEV_BYPASS:-false}
    ports:
      - "127.0.0.1:${ADA_AUTH_PORT:-8002}:8002"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=3).status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [ada]

  notify-migrate:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/notify/Dockerfile
    image: ada/notify:0.1.0
    container_name: ada-notify-migrate
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADA_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_NOTIFY_DB:-ada_notify}"
      ADA_ISSUER: ${ADA_ISSUER:?set ADA_ISSUER in .env}
      ADA_ENV: ${ADA_ENV:-local}
      ADA_LOG_LEVEL: ${ADA_LOG_LEVEL:-INFO}
    command: ["alembic", "upgrade", "head"]
    networks: [ada]

  ada-notify:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/notify/Dockerfile
    image: ada/notify:0.1.0
    container_name: ada-notify
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      notify-migrate:
        condition: service_completed_successfully
    environment:
      ADA_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_NOTIFY_DB:-ada_notify}"
      ADA_ISSUER: ${ADA_ISSUER:?set ADA_ISSUER in .env}
      ADA_INTERNAL_ISSUER_URL: ${ADA_INTERNAL_ISSUER_URL:-http://keycloak:${KC_HTTP_PORT:-8090}${KC_HTTP_RELATIVE_PATH:-/idp}/realms/${ADA_REALM:-pcsmcpl}}
      ADA_ENV: ${ADA_ENV:-local}
      ADA_LOG_LEVEL: ${ADA_LOG_LEVEL:-INFO}
      ADA_REQUIRED_SCOPE: ${ADA_REQUIRED_SCOPE:-notify:send}
      # Clients whose end-user tokens may call /v1/me (device registration, inbox).
      ADA_USER_CLIENT_IDS: ${ADA_USER_CLIENT_IDS:-ada-field,ada-web,ada-auth}
    ports:
      - "127.0.0.1:${ADA_NOTIFY_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3).status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [ada]

  ada-worker:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/notify/Dockerfile
    image: ada/notify:0.1.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notify-migrate:
        condition: service_completed_successfully
    environment:
      ADA_DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_NOTIFY_DB:-ada_notify}"
      ADA_ISSUER: ${ADA_ISSUER:?set ADA_ISSUER in .env}
      ADA_INTERNAL_ISSUER_URL: ${ADA_INTERNAL_ISSUER_URL:-http://keycloak:${KC_HTTP_PORT:-8090}${KC_HTTP_RELATIVE_PATH:-/idp}/realms/${ADA_REALM:-pcsmcpl}}
      ADA_ENV: ${ADA_ENV:-local}
      ADA_LOG_LEVEL: ${ADA_LOG_LEVEL:-INFO}
      ADA_REDIS_URL: ${ADA_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      ADA_EMAIL_PROVIDER: ${ADA_EMAIL_PROVIDER:-smtp}
      ADA_SMTP_HOST: ${ADA_SMTP_HOST:-mailpit}
      ADA_SMTP_PORT: "${ADA_SMTP_PORT:-1025}"
      ADA_SMTP_USERNAME: ${ADA_SMTP_USERNAME:-}
      ADA_SMTP_PASSWORD: ${ADA_SMTP_PASSWORD:-}
      ADA_SMTP_STARTTLS: "${ADA_SMTP_STARTTLS:-false}"
      ADA_SMTP_SSL: "${ADA_SMTP_SSL:-false}"
      ADA_EMAIL_FROM: ${ADA_EMAIL_FROM:-ada@pcsmcpl.net}
      ADA_EMAIL_FROM_NAME: ${ADA_EMAIL_FROM_NAME:-ADA}
      ADA_ADMIN_CLIENT_ID: ${ADA_ADMIN_CLIENT_ID:-ada-notify}
      ADA_ADMIN_CLIENT_SECRET: ${ADA_NOTIFY_CLIENT_SECRET:?set ADA_NOTIFY_CLIENT_SECRET in .env}
      # Direct push (FCM HTTP v1 + APNs). Unset or missing files disable that
      # platform with a startup warning; the worker still starts.
      ADA_PUSH_PROVIDER: ${ADA_PUSH_PROVIDER:-native}
      ADA_FCM_PROJECT_ID: ${ADA_FCM_PROJECT_ID:-}
      ADA_FCM_SERVICE_ACCOUNT_FILE: ${ADA_FCM_SERVICE_ACCOUNT_FILE:-/run/ada-secrets/fcm-service-account.json}
      ADA_APNS_KEY_FILE: ${ADA_APNS_KEY_FILE:-/run/ada-secrets/apns-key.p8}
      ADA_APNS_KEY_ID: ${ADA_APNS_KEY_ID:-}
      ADA_APNS_TEAM_ID: ${ADA_APNS_TEAM_ID:-}
      ADA_APNS_BUNDLE_ID: ${ADA_APNS_BUNDLE_ID:-com.adaicms.field}
    volumes:
      # infra/secrets/ is gitignored; credentials never enter the image or the repo.
      - ../secrets:/run/ada-secrets:ro
    command: ["python", "-m", "app.worker"]
    networks: [ada]

  # One-shot schema migration (ada_core.migrate, advisory-locked). ada-api and
  # ada-ml wait for it to exit 0.
  api-migrate:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: ada/api:0.1.0
    container_name: ada-api-migrate
    # The owner of the bind-mounted data/. On Linux set ADA_UID=$(id -u) and
    # ADA_GID=$(id -g) in .env; on Docker Desktop leave the default.
    user: "${ADA_UID:-10001}:${ADA_GID:-10001}"
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "ada_core.migrate"]
    healthcheck:
      disable: true
    networks: [ada]

  ada-ml:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/ml-worker/Dockerfile
    image: ada/ml:0.1.0
    container_name: ada-ml
    # Same as api-migrate: ADA_UID/ADA_GID on Linux, the default on Docker Desktop.
    user: "${ADA_UID:-10001}:${ADA_GID:-10001}"
    restart: unless-stopped
    logging: *default-logging
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      # api-migrate owns the schema in this stack.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # POOL_SIZE + MAX_OVERFLOW across ada-api, ada-ml and Keycloak must stay under max_connections.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DATA_DIR: ${ADA_DATA_PATH:-/app/data}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      # Compose is local development; anything else must set ADA_ENV and a token.
      ADA_ENV: ${ADA_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTO_FETCH_WEIGHTS: ${AUTO_FETCH_WEIGHTS:-true}
      AUTO_SAMPLE_DATA: ${AUTO_SAMPLE_DATA:-true}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_URL: ${NOTIFY_URL:-http://ada-notify:8001}
      NOTIFY_ISSUER: ${ADA_INTERNAL_ISSUER_URL:-http://keycloak:${KC_HTTP_PORT:-8090}${KC_HTTP_RELATIVE_PATH:-/idp}/realms/${ADA_REALM:-pcsmcpl}}
      NOTIFY_CLIENT_ID: ${NOTIFY_CLIENT_ID:-ada-ml}
      NOTIFY_CLIENT_SECRET: ${ADA_ML_CLIENT_SECRET:?set ADA_ML_CLIENT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      MODEL_MODE: ${MODEL_MODE:-segdiff}
      MODEL_BACKEND: ${MODEL_BACKEND:-auto}
      SEED_MODE: ${SEED_MODE:-encroachment}
      SAM_REFINE: ${SAM_REFINE:-true}
      CHIP_SIZE: ${CHIP_SIZE:-256}
      CHIP_OVERLAP: ${CHIP_OVERLAP:-64}
      CHANGE_THRESHOLD: ${CHANGE_THRESHOLD:-0.5}
      MIN_CHANGE_AREA_M2: ${MIN_CHANGE_AREA_M2:-15.0}
      ML_DEVICE: ${ML_DEVICE:-auto}
      REQUIRE_GPU: ${REQUIRE_GPU:-false}
      ONNX_CPU_THREADS: ${ONNX_CPU_THREADS:-4}
      GPU_MEMORY_LIMIT_GB: ${GPU_MEMORY_LIMIT_GB:-4.0}
      HOST_MEMORY_LIMIT_GB: ${HOST_MEMORY_LIMIT_GB:-18.0}
      BUILDING_BACKEND: ${BUILDING_BACKEND:-changestar}
      VEGETATION_MODE: ${VEGETATION_MODE:-learned}
      SUPERIMPOSE_SOURCE: ${SUPERIMPOSE_SOURCE:-auto}
      SAM_BACKEND: ${SAM_BACKEND:-sam2}
      SAM_MODEL_REPO: ${SAM_MODEL_REPO:-facebook/sam2.1-hiera-large}
      SAM_MODEL_LOCAL: ${SAM_MODEL_LOCAL:-sam2.1-hiera-large}
      INSTANCE_DECIDER: ${INSTANCE_DECIDER:-shadow}
      MIN_TRAINING_SAMPLES: ${MIN_TRAINING_SAMPLES:-150}
      DETECT_DEMOLITION: ${DETECT_DEMOLITION:-true}
      REQUEUE_STALE_ON_STARTUP: ${REQUEUE_STALE_ON_STARTUP:-true}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ../../data:${ADA_DATA_PATH:-/app/data}
      # HF_HOME in services/ml-worker/Dockerfile; the process is not root, so /root is never read.
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/app/data/hf-cache
    ports:
      - "127.0.0.1:${ML_PORT:-8100}:8100"
    networks: [ada]

  ada-api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: ada/api:0.1.0
    container_name: ada-api
    # Same as api-migrate: ADA_UID/ADA_GID on Linux, the default on Docker Desktop.
    user: "${ADA_UID:-10001}:${ADA_GID:-10001}"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # POOL_SIZE + MAX_OVERFLOW across ada-api, ada-ml and Keycloak must stay under max_connections.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DATA_DIR: ${ADA_DATA_PATH:-/app/data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OIDC_ISSUER: ${ADA_ISSUER:?set ADA_ISSUER in .env}
      OIDC_INTERNAL_ISSUER_URL: ${ADA_INTERNAL_ISSUER_URL:-http://keycloak:${KC_HTTP_PORT:-8090}${KC_HTTP_RELATIVE_PATH:-/idp}/realms/${ADA_REALM:-pcsmcpl}}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ada-web}
      # ada-api's own confidential client, for officer administration against the
      # Keycloak Admin API. Empty disables those six endpoints with a clear 503.
      OIDC_ADMIN_CLIENT_ID: ${ADA_API_CLIENT_ID:-ada-api}
      OIDC_ADMIN_CLIENT_SECRET: ${ADA_API_CLIENT_SECRET:-}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ada-ml:8100}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ADA_ENV: ${ADA_ENV:-local}
      # Clients whose access tokens ada-api accepts (azp), comma-separated.
      OIDC_ALLOWED_AZP: ${OIDC_ALLOWED_AZP:-ada-web,ada-field,ada-auth}
      WEBSITE_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      # Case-assigned push + inbox. Sent as ada-ml: ada-notify binds one client per project.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_URL: ${NOTIFY_URL:-http://ada-notify:8001}
      NOTIFY_ISSUER: ${ADA_INTERNAL_ISSUER_URL:-http://keycloak:${KC_HTTP_PORT:-8090}${KC_HTTP_RELATIVE_PATH:-/idp}/realms/${ADA_REALM:-pcsmcpl}}
      NOTIFY_CLIENT_ID: ${NOTIFY_CLIENT_ID:-ada-ml}
      NOTIFY_CLIENT_SECRET: ${ADA_ML_CLIENT_SECRET:-}
      # Cold tier (docs/ADA-Upload-and-ML-Runtime-Design.md §5). Empty endpoint
      # disables it; `docker compose --profile cold` runs a MinIO dev target.
      COLD_STORE_ENDPOINT: ${COLD_STORE_ENDPOINT:-}
      COLD_STORE_BUCKET: ${COLD_STORE_BUCKET:-ada-cold}
      COLD_STORE_REGION: ${COLD_STORE_REGION:-us-east-1}
      COLD_STORE_ACCESS_KEY: ${COLD_STORE_ACCESS_KEY:-}
      COLD_STORE_SECRET_KEY: ${COLD_STORE_SECRET_KEY:-}
      COLD_STORE_STORAGE_CLASS: ${COLD_STORE_STORAGE_CLASS:-STANDARD}
      COLD_AFTER_DAYS: ${COLD_AFTER_DAYS:-180}
      COLD_RESTORE_ETA_HOURS: ${COLD_RESTORE_ETA_HOURS:-5}
      COLD_OBJECT_LOCK_DAYS: ${COLD_OBJECT_LOCK_DAYS:-0}
    volumes:
      - ../../data:${ADA_DATA_PATH:-/app/data}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [ada]

  frontend:
    profiles: ["full"]
    build:
      # Root context, not ../../apps/web: @ada/shared only resolves from the workspace root.
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: ada/frontend:0.1.0
    container_name: ada-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      ada-api:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks: [ada]

  # Self-hosted OTA updates for the field app (apps/field/README.md §Shipping a change).
  # Opt-in: `docker compose --profile ota up -d ada-ota`. Releases are written to
  # data/ota-updates by apps/field/scripts/publish-update.mjs, already signed. This
  # service holds no signing key, so a compromised host cannot sign new code.
  ada-ota:
    profiles: [ota]
    build:
      context: ../ota
    image: ada/ota:0.1.0
    container_name: ada-ota
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ../../data/ota-updates:/updates:ro
    ports:
      - "${ADA_OTA_BIND:-127.0.0.1}:${ADA_OTA_PORT:-8020}:8020"
    networks: [ada]

volumes:
  ada_pgdata:
  ada_redisdata:
  ada_mailpitdata:
  minio-data:

networks:
  ada:
    driver: bridge
