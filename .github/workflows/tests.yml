name: Tests — Python suites

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # One pytest run over the whole tree is not possible: api, ml, auth and
      # notify each have a top-level package called `app`, so a single session
      # imports whichever it reaches first. run_tests.sh runs them one at a
      # time, which is why it is the entry point here too.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/python/ada-core -e libs/python/ada-platform
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Run suites
        run: PYTEST="python -m pytest" ./scripts/run_tests.sh
