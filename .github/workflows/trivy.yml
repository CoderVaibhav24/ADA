name: Trivy — Infrastructure Scan

on:
  push:
    branches: ['**']
  schedule:
    - cron: '0 4 * * 1'  # weekly Monday 04:00 UTC

jobs:
  trivy-scan:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan Dockerfiles and Compose
        run: |
          echo "## Trivy Infrastructure Scan" >> $GITHUB_STEP_SUMMARY

          for target in \
            backend/api/Dockerfile \
            backend/auth/Dockerfile \
            backend/ml/Dockerfile \
            backend/notify/Dockerfile \
            frontend/Dockerfile \
            infra/docker-compose.yml; do

            echo "### \`$target\`" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            trivy config "$target" --exit-code 0 --severity HIGH,CRITICAL 2>&1 \
              | tee -a /tmp/trivy-out.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          done
