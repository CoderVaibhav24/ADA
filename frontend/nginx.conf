# Production counterpart of the Vite dev proxy in vite.config.ts: the browser
# talks to one origin only (http://localhost:5173), so SuperTokens session
# cookies are same-origin and no CORS preflight is involved.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Orthophoto uploads are whole GeoTIFFs — never buffer or cap them.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;   # stream large raster uploads through
        proxy_read_timeout   3600s;    # analysis runs are minutes long
        proxy_send_timeout   3600s;
    }

    # SPA: every non-file route (/auth, /projects/...) is served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
