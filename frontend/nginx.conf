# Production counterpart of the Vite dev proxy in vite.config.ts: the browser
# talks to one origin only (http://localhost:5173), so no CORS preflight is
# involved on any /api call.
#
# Authentication is a bearer token now rather than a cookie, which changes
# nothing here — but it does mean the Authorization header has to survive the
# proxy, and proxy_pass forwards it by default. Do NOT add a proxy_set_header
# that clears it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Orthophoto uploads are whole GeoTIFFs — never buffer or cap them.
    client_max_body_size 0;

    # Headers, not bodies. Cookies are scoped to a HOST, not a host:port, so
    # every application ever served from localhost — the SuperTokens stack this
    # replaced, an HRMS Keycloak on another port, anything else in development
    # — leaves cookies that the browser then sends here too. nginx's defaults
    # (1k, and 4 buffers of 8k) are generous for one app and not for a shared
    # localhost, and being over them is a flat refusal before any proxying:
    #
    #   400 Bad Request — Request Header Or Cookie Too Large
    #
    # ADA itself sets no cookies at all; it authenticates with a bearer token.
    # So none of this header weight is ours, and refusing to serve the console
    # because another application was untidy is the wrong trade.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    # Keycloak, under the app's own origin.
    #
    # This is what stops the browser leaving localhost:5173 to sign in. The
    # path is /idp rather than /auth because the SPA already routes
    # /auth/callback and /auth/signed-out, and Keycloak would shadow them.
    #
    # KC_HTTP_RELATIVE_PATH is set to the SAME /idp, so the path is NOT
    # stripped here — Keycloak expects to see it. A trailing slash on
    # proxy_pass would strip it and every Keycloak URL would 404.
    location /idp/ {
        proxy_pass http://keycloak:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak reads these to build absolute URLs (KC_PROXY_HEADERS=
        # xforwarded). Omitting Host or X-Forwarded-Proto produces redirects
        # back to the container's own address.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # The login page posts a form; the default 4k/8k buffers are tight once
        # a KEYCLOAK_IDENTITY cookie and a long state parameter are in play.
        proxy_buffer_size   16k;
        proxy_buffers       8 32k;
        proxy_busy_buffers_size 64k;
    }

    # ada-auth, for the phone and email one-time-code flows. Same origin as the
    # app deliberately: the browser then needs no CORS preflight, and the
    # service stays on loopback rather than being published for the SPA's sake.
    location /auth-api/ {
        proxy_pass http://ada-auth:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ada-auth throttles per IP when ADA_OTP_IP_LIMITS_ENABLED is on, and
        # without this every request arrives from nginx — one address for the
        # whole estate, which locks out everyone at once instead of one caller.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ada-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;   # stream large raster uploads through
        proxy_read_timeout   3600s;    # analysis runs are minutes long
        proxy_send_timeout   3600s;
    }

    # SPA: every non-file route (/auth, /projects/...) is served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
